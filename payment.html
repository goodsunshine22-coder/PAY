<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Form</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.container{
    width:350px;
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}
input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}
.row{
    display:flex;
    gap:10px;
}
button{
    width:100%;
    padding:12px;
    background:#635bff;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
button:hover{
    background:#4c44d6;
}
</style>
</head>

<body>

<div class="container">
<h2>Checkout</h2>

<form action="/process-payment" method="POST">

<input
    type="email"
    name="email"
    placeholder="Email"
    required>

<!-- Replace these with Stripe Elements in production -->

<input
    type="text"
    name="cardholder"
    placeholder="Cardholder Name">

<input
    type="text"
    name="card_number"
    placeholder="Card Number"
    autocomplete="off">

<div class="row">
<input
    type="text"
    name="expiry"
    placeholder="MM/YY">

<input
    type="text"
    name="cvv"
    placeholder="CVV">
</div>

<button type="submit">
    Pay Now
</button>

</form>
</div>

</body>
</html>
